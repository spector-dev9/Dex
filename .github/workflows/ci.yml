name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck bridge
        run: npm run typecheck

      - name: Contract and bridge tests
        run: npm test

      - name: Python syntax
        run: python3 -m py_compile scripts/*.py tests/spikes/scripts/*.py

      - name: Architecture boundaries
        run: python3 scripts/check-architecture.py

      - name: Kotlin bridge contract parity
        run: python3 scripts/check-bridge-contract.py

      - name: License artifacts are valid
        run: |
          python3 scripts/check-licenses.py
          (cd docs/licenses/texts && sha256sum -c SHA256SUMS)

      - name: Contract drift checker
        run: python3 scripts/check-contract-drift.py --doc contract/openapi/opencode-1.19.3.json

      - name: Inventory is reproducible
        run: |
          python3 scripts/build-inventory.py
          git diff --exit-code -- contract/endpoints.json

  kotlin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fetch pinned Alpine Node test artifacts
        run: python3 scripts/fetch-runtime.py --alpine-node

      - name: Compile and verify core contracts
        run: ./gradlew --no-daemon -PskipApp=true coreCheck

      - name: Verify provisional-member annotations
        run: python3 scripts/check-provisional.py

      - name: Upload provisional contracts
        uses: actions/upload-artifact@v4
        with:
          name: g1-provisional-contracts
          path: |
            core/*-api/build/libs/*.jar
            build/reports/g1/provisional-members.txt
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android platform and build tools
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Build debug and release APKs
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease

      - name: Check release manifest security invariants
        run: |
          python3 tests/security/test_release_manifest.py
          python3 scripts/check-release-manifest.py \
            app/build/intermediates/merged_manifest/release/processReleaseMainManifest/AndroidManifest.xml

      - name: Compile isolated spike harness
        run: ./gradlew --no-daemon -PspikeHarness=true -PskipApp=true :spike-harness:assembleDebug

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: app-apks
          path: |
            app/build/outputs/apk/**/*.apk
            tests/spikes/harness/build/outputs/apk/**/*.apk
          if-no-files-found: error
